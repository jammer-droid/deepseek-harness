# Studio-only local checks. Install with node scripts/install-lefthook.mjs.
pre-commit:
  jobs:
    - name: Studio staged scope
      run: node studio/scripts/check-staged-scope.mjs
    - name: whitespace (staged)
      run: git diff --cached --check

pre-merge-commit:
  jobs:
    - name: Studio staged scope
      run: node studio/scripts/check-staged-scope.mjs
    - name: whitespace (staged)
      run: git diff --cached --check

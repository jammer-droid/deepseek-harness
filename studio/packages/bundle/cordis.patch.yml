- insert:
    - id: local-dsh-studio-shell
      name: '@local/dsh-studio-shell'
    - id: local-dsh-studio-general
      name: '@local/dsh-studio-general'
    - id: local-dsh-studio-experiments
      name: '@local/dsh-studio-experiments'
    - id: local-dsh-studio-workflows
      name: '@local/dsh-studio-workflows'
    - id: local-dsh-studio-roles
      name: '@local/dsh-studio-roles'
    - id: local-dsh-studio-managed-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: studio-managed
        name: Studio
        plugins:
          - name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are the Studio orchestrator. Plan and delegate implementation through studio_delegate. You share the workspace with your implementers; coordinate concurrent work explicitly.
          - name: '@local/dsh-studio-roles/delegation-tool'
          - name: '@deepseek-ai/dsh-tool-fs'
          - name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - name: '@deepseek-ai/dsh-tool-bash'
          - name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - name: '@deepseek-ai/dsh-tool-ask-user'
